<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Ink Playground</title><link rel="stylesheet" href="ink.css"><script src="ink.js" defer></script>
</head><body><main class="studio">
<header><p class="eyebrow">Generative study</p><h1>Digital Ink.</h1><p>Drag to draw. Move slowly for a wider line, flick for a thin tail, and lift to finish.</p></header>
<div class="ink-controls"><div role="group" aria-label="Ink color"><button type="button" class="ink-color" aria-pressed="true" data-color="charcoal">Charcoal</button><button type="button" class="ink-color" aria-pressed="false" data-color="green">Moss</button></div><label class="brush-size" for="brush-size">Size <input type="range" id="brush-size" min="8" max="48" step="1" value="32" aria-label="Brush size"><output id="brush-size-value" for="brush-size">32</output></label><button type="button" id="clear">Clear paper</button></div>
<div class="paper"><canvas tabindex="0" id="ink" aria-label="Interactive ink paper" aria-describedby="ink-help">An interactive surface for drawing smooth ink trails.</canvas><span class="ink-reticle" aria-hidden="true"></span></div>
<p id="ink-help">Touch and drag to paint. With the paper focused, use the arrow keys to move and Space to place an ink drop.</p>
<noscript><p>Drawing requires JavaScript.</p></noscript>
</main></body></html>
